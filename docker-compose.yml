# GPU:  docker compose up -d
services:
  parakeet:
    build: .
    image: parakeet-api:latest
    container_name: parakeet-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      PARAKEET_LOCAL_ATTN_AFTER: ${PARAKEET_LOCAL_ATTN_AFTER:-480}
      API_KEY: ${API_KEY:-}
    volumes:
      - parakeet-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  parakeet-data:
